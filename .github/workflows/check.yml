name: Check Pick-a-Brick

on:
  schedule:
    - cron: "3-59/10 * * * *"   # GitHub may delay or skip runs; ~10-15 min is realistic
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run checker
        env:
          PAB_ELEMENT_ID: ${{ vars.PAB_ELEMENT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 check_pab.py
      - name: Save state
        run: |
          git config user.name "pab-bot"
          git config user.email "pab-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
